<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bakerosoft Apps</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
            text-align: center;
        }
        h1 {
            color: #1a1a1a;
        }
        .links-container {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        a {
            display: block;
            padding: 12px 20px;
            background-color: #f4f4f5;
            color: #0066cc;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
            transition: background-color 0.2s;
            border: 1px solid #e4e4e7;
        }
        a:hover {
            background-color: #e4e4e7;
        }
        footer {
            margin-top: 50px;
            font-size: 0.85em;
            color: #666;
        }
    </style>
</head>
<body>

    <h1>Bakerosoft</h1>
    <p>Welcome to our developer homepage. Below you can find important developer files and legal disclosures for our mobile applications.</p>

    <div class="links-container">
        <a href="https://github.io">View Privacy Policy</a>
        <a href="https://gusurads1-dot.github.io/app-ads.txt">View app-ads.txt</a>
    </div>

    <footer>
        &copy; 2026 Bakerosoft. All rights reserved.
    </footer>

</body>
</html>
